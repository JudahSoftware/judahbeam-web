<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Judah Beam's mark, "One to all": one device beams out to three others.
       The same picture as design/the-box-icon.svg in the app's source. -->
  <defs>
    <linearGradient id="fan" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#4f46e5"/>
  <g stroke="url(#fan)" stroke-width="5" stroke-linecap="round">
    <line x1="50" y1="72" x2="22" y2="32"/><line x1="50" y1="72" x2="50" y2="22"/><line x1="50" y1="72" x2="78" y2="32"/>
  </g>
  <circle cx="50" cy="72" r="17" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
  <circle cx="50" cy="72" r="10" fill="#fff"/>
  <rect x="15" y="25" width="14" height="14" rx="4" fill="#fff"/>
  <rect x="43" y="15" width="14" height="14" rx="4" fill="#fff"/>
  <rect x="71" y="25" width="14" height="14" rx="4" fill="#fff"/>
</svg>
